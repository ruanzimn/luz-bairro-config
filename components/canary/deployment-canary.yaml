apiVersion: apps/v1
kind: Deployment
metadata:
  name: luz-bairro-canary
  labels:
    app: luz-bairro-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: luz-bairro-canary
  template:
    metadata:
      labels:
        app: luz-bairro-canary
    spec:
      containers:
        - name: luz-bairro
          # Nome simbolico: declare o digest em "images" do overlay (name: luz-bairro-canary).
          image: luz-bairro-canary
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: luz-bairro-config
          env:
            # "env" tem precedencia sobre "envFrom": o canary informa a PROPRIA versao,
            # o que permite distinguir as duas versoes ao amostrar a Route.
            # TODO(aluno): troque pelo APP_VERSION (SHA curto) da versao que esta testando.
            - name: APP_VERSION
              value: "canary"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
