apiVersion: apps/v1
kind: Deployment
metadata:
  name: luz-bairro
  labels:
    app: luz-bairro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: luz-bairro
  template:
    metadata:
      labels:
        app: luz-bairro
    spec:
      containers:
        - name: luz-bairro
          # Nome simbolico: o campo "images" do overlay troca por <registry>/<projeto>/luz-bairro@sha256:...
          image: luz-bairro
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: luz-bairro-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
