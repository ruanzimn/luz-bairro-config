apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - route.yaml

# O Kustomize acrescenta um hash ao nome do ConfigMap e o referencia no Deployment:
# qualquer mudanca de configuracao gera um novo rollout.
configMapGenerator:
  - name: luz-bairro-config
    literals:
      - APP_MESSAGE=Portal Luz do Bairro
      - APP_ENV=base
      - APP_VERSION=0000000
