apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TODO(aluno): troque cicd-dev pelo seu projeto de desenvolvimento ($DEV_NS) aqui e em "newName".
namespace: cicd-dev-ruanrodrigues

resources:
  - ../../base

# As linhas "newName", "digest" e "APP_VERSION" sao reescritas pelo pipeline (task update-config).
# Nao altere o formato delas: o pipeline as localiza por padrao de texto.
images:
  - name: luz-bairro
    newName: image-registry.openshift-image-registry.svc:5000/cicd-dev-ruanrodrigues/luz-bairro
    digest: sha256:05b63882729089a452205a3ac150534b56da34a84b6c5e644fb9a7a5924104ac

configMapGenerator:
  - name: luz-bairro-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - APP_VERSION=a692ed1

